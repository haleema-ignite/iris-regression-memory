id: IRIS-BEH-0006
title: Keep Brand Messenger ingest idempotent on doc_src_id
status: approved

scope:
  products: [iris]
  repositories:
    - ignitetech-group/iris-sp-engines
    - ignitetech-group/iris-api
    - haleema-ignite/iris-regression-memory
  services: [brand-messenger-webhook]
  paths:
    - engines/brand-messenger/**
    - fixtures/sandbox/engines/brand-messenger/**
  symbols:
    - doc_src_id
  interfaces:
    kafka_topics: []
    configuration_keys: []

incident:
  severity: sev2
  references:
    - type: jira
      key: IRISNG-3729
      url: https://ignitetechpm.atlassian.net/browse/IRISNG-3729
    - type: jira
      key: IRISNG-3836
      url: https://ignitetechpm.atlassian.net/browse/IRISNG-3836

behavior:
  invariant: >
    The same Brand Messenger platform message id must produce one logical
    document. Retries and dual publishers must not insert a second row for
    the same doc_src_id.
  failure_mechanism: >
    Ingest used a derived or unstable identity, so a retried webhook or a
    second publisher component created duplicate doc_document rows.
  triggers:
    - webhook retry
    - sibling publisher component enabled
  consequences:
    - duplicate Care documents
    - duplicate agent work

applicability:
  strong_anchors:
    - doc_src_id
    - brand-messenger
  violation_signals:
    - new Date() as doc_src_id
    - uuid as message id
    - skip doc_src_id
  exclusions:
    - schema migrations that add a unique index without changing publishers
  confidence: high

required_guards:
  - stable platform message id as doc_src_id
  - reject or ignore a second insert for the same source id

governance:
  owner: social-platform-team
  approved_by: haleema-ignite
  approved_at: 2026-08-29
  review_after: 2027-02-28
  version: 1
