id: IRIS-BEH-0004
title: Isolate Facebook page auth failures per page
status: approved

scope:
  products: [iris]
  repositories:
    - ignitetech-group/iris-sp-engines
    - ignitetech-group/iris-api
  services: [facebook-polling]
  paths:
    - engines/facebook/src/polling/**
    - engines/facebook/src/index.ts
    - fixtures/sandbox/engines/facebook/src/polling/**
    - src/controllers/sp/facebook.controller.ts
    - src/controllers/orchestrator.controller.ts
  symbols:
    - authState
    - TOKEN_INVALID
    - Skipping poll
  interfaces:
    kafka_topics: []
    configuration_keys: []

incident:
  severity: sev2
  references:
    - type: jira
      key: IRISNG-4040
      url: https://ignitetechpm.atlassian.net/browse/IRISNG-4040
    - type: github
      url: https://github.com/ignitetech-group/iris-sp-engines/pull/413
    - type: github
      url: https://github.com/ignitetech-group/iris-api/pull/1112

behavior:
  invariant: >
    An invalid token on one Facebook page must not stop polling or mark auth
    degraded for other healthy pages on the same engine.
  failure_mechanism: >
    A Meta code 190 on a single page was treated as engine-wide auth failure,
    so sibling pages stopped collecting.
  triggers:
    - one page token revoked
    - mixed-page Facebook engine
  consequences:
    - collection outage for healthy pages
    - false reconnect_required for the whole engine

applicability:
  strong_anchors:
    - authState
    - page auth blocked
    - Meta code 190
    - TOKEN_INVALID
  violation_signals:
    - markAuthDegraded on any page 190
    - skip all pages after one 190
    - engine-wide auth failure
  removal_signals:
    - authState
  excluded_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
  exclusion_notes:
    - single-page engines that have no sibling pages
  confidence: high

required_guards:
  - per-page authState with skip only for the blocked page
  - do not mark the engine degraded unless every page is blocked

governance:
  owner: social-platform-team
  approved_at: 2026-08-29
  review_after: 2027-02-28
  version: 1
