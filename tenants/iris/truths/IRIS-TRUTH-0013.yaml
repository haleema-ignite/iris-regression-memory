id: IRIS-TRUTH-0013
tenant: iris
title: Isolate Facebook page auth failures per page
statement: >
  An invalid token on one Facebook page must not stop polling or mark auth
  degraded for other healthy pages on the same engine.
status: live
legacy_id: IRIS-BEH-0004
executor:
  kind: pattern
  blocking: true
  emit: none
  mode: added_lines
  forbidden_signals:
    - markAuthDegraded on any page 190
    - skip all pages after one 190
    - engine-wide auth failure
  forbidden_signal_groups:
    - ["if (authOk)", componentManager.markAuthDegraded, components not started]
  required_signals:
    - authState
applies_to:
  repositories:
    - ignitetech-group/iris-sp-engines
    - ignitetech-group/iris-api
  paths:
    - engines/facebook/src/polling/**
    - engines/facebook/src/index.ts
    - src/controllers/sp/facebook.controller.ts
    - src/controllers/orchestrator.controller.ts
  excluded_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
evidence:
  - type: jira
    key: IRISNG-4040
    url: https://ignitetechpm.atlassian.net/browse/IRISNG-4040
failure_mechanism: >
  A Meta code 190 on a single page was treated as engine-wide auth failure.
required_guards:
  - Per-page authState with skip only for the blocked page
governance:
  owner: social-platform-team
  approved_at: 2026-09-01
  review_after: 2027-03-01
  version: 1
