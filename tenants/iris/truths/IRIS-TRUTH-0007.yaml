id: IRIS-TRUTH-0007
tenant: iris
title: Instagram polling watermarks stay durable across restarts
statement: >
  Instagram polling must persist watermarks and comment floors across restarts.
  In-memory-only seen-id sets and disabled persistence recreate duplicate Care
  comments after a pod restart.
status: live
proves: >
  that this change did not disable watermark persistence or reintroduce in-memory-only dedup. It does not prove the durable floor exists — an engine that never had one passes.
legacy_id: IRIS-BEH-0002
executor:
  kind: pattern
  blocking: true
  emit: none
  mode: added_lines
  # `skip persistState` and `in-memory only dedup` were removed: they are prose
  # descriptions of the failure, not tokens that appear in TypeScript, so they
  # could only ever match a hand-written fixture. Every real detection for this
  # truth came from the line pattern or the signal group below.
  forbidden_signals:
    - POLL_WATERMARK_PERSISTENCE_ENABLED = false
    - "seenIds: new Set()"
  forbidden_signal_groups:
    - [SEEN_ID_TTL_MS = 48 * 60 * 60 * 1000, "mergeSeenIds("]
  forbidden_line_patterns:
    - 'persistState\s*\(\s*account\s*,\s*[''"]comments[''"]\s*,\s*\{\s*seenIds\s*:[^,}]+\}\s*\)'
    # config.ts declares the flag through Joi, so `= false` never appears there.
    - 'POLL_WATERMARK_PERSISTENCE_ENABLED[^\n]{0,120}?default\(\s*false'
  # commentsFloor, commentFloorMs and isBelowFloor were listed as required
  # guards but exist nowhere in engines/instagram: they could never be detected
  # as removed. The remaining token is real (config.ts) and is worth guarding.
  required_signals:
    - POLL_WATERMARK_PERSISTENCE_ENABLED
applies_to:
  repositories:
    - ignitetech-group/iris-sp-engines
    - ignitetech-group/iris-api
  paths:
    - engines/instagram/src/polling/**
    - engines/instagram/src/instagram-polling-state-client.ts
    - engines/instagram/src/config.ts
    - src/repositories/mongodb/instagramPollingState.repository.ts
  excluded_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
evidence:
  - type: jira
    key: IRISNG-3940
    url: https://ignitetechpm.atlassian.net/browse/IRISNG-3940
  - type: rca
    note: pod5 Facebook DM watermark was in-memory; X engine already persisted
failure_mechanism: >
  Seen IDs lived in memory. After restart the collector rescanned without a
  timestamp floor and republished old comments.
required_guards:
  - Persist a non-advancing comments floor and keep durable retention consistent
governance:
  owner: social-platform-team
  approved_at: 2026-09-01
  review_after: 2027-03-01
  version: 3
