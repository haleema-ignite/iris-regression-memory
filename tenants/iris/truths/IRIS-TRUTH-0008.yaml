id: IRIS-TRUTH-0008
tenant: iris
title: Normal integration enumeration excludes deleted rows
statement: >
  Queries that enumerate int_integration for normal agent or admin flows must
  mention int_deleted so soft-deleted rows are not treated as live. This is a
  reintroduction check on added SQL, not a scan of pre-existing enumerations.
  Historical joins and includeDeleted lookups are allowed.
status: live
proves: >
  that no enumeration this change added omits int_deleted. Pre-existing enumerations in the same file are deliberately not adjudicated.
executor:
  kind: contract
  blocking: true
  # Was `emit: semgrep`, which silently produced nothing: this truth is
  # expressed as a query anchor plus a required token in the same statement, and
  # there is no regex that captures "mentions X somewhere in this statement".
  # Declaring an emit target that compiles to no rule made the manifest claim
  # Semgrep coverage that did not exist.
  emit: none
  languages:
    - typescript
    - javascript
    - java
  query_anchor: int_integration
  query_required: int_deleted
  # `JOIN int_integration` was redundant: joins are excluded structurally by the
  # executor before the allowance list is consulted.
  query_allow_if:
    - includeDeleted
    - withDeleted
    - historical
  mode: added_lines
applies_to:
  repositories:
    - ignitetech-group/iris-api
  paths:
    - src/repositories/**/*.ts
    - src/services/**/*.ts
  coupling:
    - care-shared-schema
  excluded_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
evidence:
  - type: jira
    key: IRISNG-3453
    url: https://ignitetechpm.atlassian.net/browse/IRISNG-3453
failure_mechanism: >
  Legacy enumeration included int_deleted=1 rows and surfaced deleted
  integrations as live.
required_guards:
  - Filter int_deleted on normal enumeration
governance:
  owner: care-compatibility-maintainers
  approved_at: 2026-09-01
  review_after: 2027-03-01
  version: 4
