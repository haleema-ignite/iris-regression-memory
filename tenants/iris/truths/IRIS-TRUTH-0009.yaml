id: IRIS-TRUTH-0009
tenant: iris
title: Marketing Meta shared mode must not require SOCIALGATEWAY secrets
statement: >
  After publishing moved off SocialGateway, Marketing Meta shared-mode code
  must not still require SOCIALGATEWAY_FACEBOOK_* or SOCIALGATEWAY_INSTAGRAM_*
  as a hard gate.
status: live
executor:
  kind: decision
  blocking: true
  emit: none
  # Was three exact English sentences. Only two of them matched anything, and any
  # reword of the error message would have silently converted this ratchet into a
  # pass — the failure mode a ratchet exists to prevent. Matching the credential
  # name plus "is required" on the same line is reword-tolerant and still
  # specific to a hard gate, so `idName: 'SOCIALGATEWAY_FACEBOOK_APP_ID'` in the
  # oauth fallback chain does not match.
  leftover_patterns:
    - "SOCIALGATEWAY_(?:FACEBOOK|INSTAGRAM)_APP_(?:ID|SECRET)[^\\n'\"]*\\bis required\\b"
  files:
    - src/services/smm/content-sources.service.ts
    - src/services/oauth/facebook.oauth.ts
    - src/services/oauth/instagram.oauth.ts
  allowlist_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
applies_to:
  repositories:
    - ignitetech-group/iris-api
  paths:
    - src/services/smm/content-sources.service.ts
    - src/services/oauth/facebook.oauth.ts
    - src/services/oauth/instagram.oauth.ts
    - src/services/oauth/marketing-meta*
  scan_workspace: true
  excluded_paths:
    - "**/*.test.ts"
    - "**/__tests__/**"
evidence:
  - type: jira
    key: IRISNG-3905
    url: https://ignitetechpm.atlassian.net/browse/IRISNG-3905
failure_mechanism: >
  A leftover SocialGateway credential gate survived after the decision to
  publish without SocialGateway. The dangerous file is often not in the PR.
required_guards:
  - Remove SOCIALGATEWAY hard-requires from Marketing Meta shared mode
governance:
  owner: social-platform-team
  approved_at: 2026-09-01
  review_after: 2027-03-01
  version: 2
