rules:
  - id: truth-compiler.IRIS-TRUTH-0006
    message: "IRIS-TRUTH-0006: Values written into Care int_meta must be
      serializable as Map<String,String>. Nested objects such as
      int_meta.apiParams or intMetaOverride.apiParams must not be written as
      objects, including assignment form `apiParams = {`."
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      truth_id: IRIS-TRUTH-0006
      executor: contract
      source: truth-compiler
    paths:
      include:
        - src/services/**/*provisioner*
        - src/services/admin/source-integrations*
        - src/repositories/admin/source-integrations*
        - src/utils/care-integration-identity.ts
      exclude:
        - "**/*.test.ts"
        - "**/__tests__/**"
    pattern-regex: "(apiParams\\s*:\\s*\\{|apiParams\\s*=\\s*\\{|int_meta\\.apiPara\
      ms\\s*=\\s*\\{|intMetaOverride\\.apiParams\\s*=\\s*\\{|int_meta: \\{
      apiParams)"
  - id: truth-compiler.IRIS-TRUTH-0019
    message: "IRIS-TRUTH-0019: Queries must not add LIKE '%…%' against int_meta or
      other large Care tables. Leading wildcards cannot use indexes. This is a
      reintroduction check on added lines, not a leftover ratchet for
      pre-existing queries in files the PR touched."
    languages:
      - typescript
      - javascript
      - java
    severity: ERROR
    metadata:
      truth_id: IRIS-TRUTH-0019
      executor: semgrep
      source: truth-compiler
    paths:
      include:
        - src/**/*.ts
      exclude:
        - "**/*.test.ts"
        - "**/__tests__/**"
    pattern-regex: (LIKE\s+['"]%|int_meta LIKE '%)
