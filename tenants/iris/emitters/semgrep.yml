# Truth Compiler — whole-checkout rules.
#
# These come from truths that intentionally ratchet against the full
# checkout, so a plain repository-wide Semgrep run is correct for them.
rules:
  - id: truth-compiler.IRIS-TRUTH-0006
    message: "IRIS-TRUTH-0006: Values written into Care int_meta must be
      serializable as Map<String,String>. Nested objects such as
      int_meta.apiParams or intMetaOverride.apiParams must not be written as
      objects, including assignment form `apiParams = {`."
    languages:
      - typescript
      - javascript
    severity: ERROR
    metadata:
      truth_id: IRIS-TRUTH-0006
      executor: contract
      source: truth-compiler
      scope: workspace
    paths:
      include:
        - src/services/**/*provisioner*
        - src/services/admin/source-integrations*
        - src/repositories/admin/source-integrations*
        - src/utils/care-integration-identity.ts
      exclude:
        - "**/*.test.ts"
        - "**/__tests__/**"
    pattern-regex: "(apiParams\\s*:\\s*\\{|apiParams\\s*=\\s*\\{|int_meta\\.apiPara\
      ms\\s*=\\s*\\{|intMetaOverride\\.apiParams\\s*=\\s*\\{|int_meta: \\{
      apiParams)"
