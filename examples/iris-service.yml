# Optional GitHub Action for a later warning-mode service install.
# The team trial is local: npm run trial:local -- --iris-root /path/to/IRIS
# Do not add this file to ignitetech-group IRIS repositories for the current trial.

name: Truth Compiler

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  truth-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: haleema-ignite/iris-regression-memory@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tenant: iris
          enforcement: error
          comment: "true"
