name: Assess behavioral contracts

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  assess:
    name: regression-memory
    runs-on: ubuntu-latest
    steps:
      # Never execute code from the pull-request head in a privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Assess untrusted diff with trusted base code
        run: node dist/action.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGRESSION_MEMORY_TARGET_REPOSITORY: ignitetech-group/iris-sp-engines
          REGRESSION_MEMORY_ENFORCEMENT: warning
