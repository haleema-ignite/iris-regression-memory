name: Behavioral Regression Memory
description: Detect approved historical failure mechanisms in pull-request diffs.
inputs:
  token:
    description: GitHub token used to read the pull-request diff and write the comment and Check Run.
    required: true
  target_repository:
    description: Repository whose behavioral contracts should be applied. Defaults to the pull-request repository.
    required: false
    default: ""
  enforcement:
    description: warning produces a neutral check for findings; error produces a failing check and exit code.
    required: false
    default: warning
  comment:
    description: Whether to create or update the sticky pull-request comment.
    required: false
    default: "true"
runs:
  using: node24
  main: dist/action.cjs
